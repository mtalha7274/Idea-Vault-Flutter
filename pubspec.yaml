name: idea_vault
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.7
  easy_localization_loader: ^2.0.2
  get_it: ^9.2.1
  shared_preferences: ^2.2.3
  gap: ^3.0.1
  flutter_svg: ^2.0.10+1
  flutter_native_splash: ^2.4.1
  fluttertoast: ^9.0.0
  equatable: ^2.0.5
  provider: ^6.1.2
  flutter_dotenv: ^6.0.1
  keyboard_actions: ^4.2.0
  in_app_review: ^2.0.10
  package_info_plus: ^9.0.0
  device_info_plus: ^12.0.0
  connectivity_plus: ^6.1.3
  url_launcher: ^6.3.1
  share_plus: ^12.0.0
  flutter_animate: ^4.5.2
  image_picker: ^1.1.2
  path: ^1.9.0
  image: ^4.5.4
  intl: ^0.20.2
  flutter_image_compress: ^2.4.0
  dio: ^5.8.0+1
  path_provider: ^2.1.5
  sqflite: ^2.4.2+1
  google_fonts: ^8.0.2
  markdown: ^7.2.0
  markdown_widget: ^2.3.2+8
  pdf: ^3.12.0
  printing: ^5.11.0
  permission_handler: ^12.0.1
  speech_to_text: ^7.3.0
  rename_app: ^1.6.5
  firebase_core: ^4.7.0
  firebase_app_check: ^0.4.3
  cloud_functions: ^6.2.0
  google_sign_in: ^7.2.0
  googleapis: ^15.0.0
  http: ^1.4.0
  icloud_storage: ^2.2.0
  workmanager: ^0.9.0+3
  purchases_flutter: ^10.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0+3
  visibility_detector: ^0.4.0+2
  change_app_package_name: ^1.5.0

# TODO: Currently native splash icon is blank icon with same color as background color
# You can use your app background color here but then also change the icon (as currently its a blank background colored image) 
flutter_native_splash:
  color: "#d7ccfe"
  image: "assets/images/logo.png"
  android: false
  ios: true
  web: false
  android_12:
    color: "#d7ccfe"
    icon_background_color: "#d7ccfe"
    image: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/icons/
    - assets/fonts/
    - assets/images/
    - .env

  fonts:
    - family: Inter
      fonts:
      - asset: assets/fonts/Inter_18pt-Regular.ttf

dependency_overrides:
  google_fonts: ^8.0.2
